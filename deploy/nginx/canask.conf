# CANASK origin nginx (runs in the `nginx` compose service).
# Topology: client -> Cloudflare -> THIS nginx -> gunicorn (`web:5000`).
#
# TLS is terminated here with a Cloudflare Origin Certificate, and Authenticated Origin Pulls (mTLS)
# make nginx reject any connection that doesn't present Cloudflare's client certificate -- so even if
# someone finds the origin IP they can't reach the app directly. Set the Cloudflare SSL/TLS mode to
# "Full (strict)" and enable Authenticated Origin Pulls (see LAUNCH_TODO.md).
#
# Required files (mounted read-only at /etc/nginx/tls, operator-provided, gitignored):
#   origin.pem                      - Cloudflare Origin Certificate
#   origin.key                      - its private key
#   cloudflare-origin-pull-ca.pem   - Cloudflare's Authenticated Origin Pull CA
#                                     (https://developers.cloudflare.com/ssl/origin-configuration/authenticated-origin-pull/)

upstream canask_app {
    server web:5000;
}

# Trust Cloudflare's edge IPs so the real client IP (CF-Connecting-IP) is honored for logging/limits.
# Refresh from https://www.cloudflare.com/ips/ if Cloudflare changes ranges. Do NOT use 0.0.0.0/0.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# Plain HTTP: redirect everything to HTTPS. (Cloudflare normally connects over 443; this covers any
# stray HTTP and lets the /healthz probe work without TLS.)
server {
    listen 80;
    listen [::]:80;
    server_name _;

    location = /healthz {
        proxy_pass http://canask_app;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/origin.pem;
    ssl_certificate_key /etc/nginx/tls/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Authenticated Origin Pulls: require Cloudflare's client certificate.
    ssl_client_certificate /etc/nginx/tls/cloudflare-origin-pull-ca.pem;
    ssl_verify_client on;

    client_max_body_size 2m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Container/nginx healthchecks use the :80 /healthz above (no TLS, no client cert). This :443
    # block is only ever reached by Cloudflare-originated requests, since ssl_verify_client rejects
    # cert-less connections at the handshake.
    location = /healthz {
        proxy_pass http://canask_app;
        access_log off;
    }

    location / {
        proxy_pass http://canask_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # $scheme is trustworthy only because TLS terminates here AND Cloudflare runs Full (strict) +
        # Authenticated Origin Pulls (launch-gating steps in LAUNCH_TODO.md) -- in Flexible mode the
        # client->edge leg could be plaintext while this still reports https.
        proxy_set_header X-Forwarded-Proto $scheme;
        # Pass the real client IP through unaltered -- ProxyFix and the rate limiter key on it.
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # Flask serves /static/ itself (Flask-Assets bundles build lazily on first request); Cloudflare
    # edge-caches these, so proxying to one upstream is simplest and avoids stale shared-volume assets.
    # (No proxy_cache here on purpose -- Cloudflare does the edge caching; an nginx cache zone would
    # add a second layer of staleness to reason about for no win on a single-upstream setup.)
    location /static/ {
        proxy_pass http://canask_app;
        proxy_set_header Host $host;
    }
}
