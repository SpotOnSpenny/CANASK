# Runs the pytest suite on every PR and every push to master.
# Host pip + a postgres service container (not docker compose): pip caching makes the
# env step ~30s, and the tests need only the webapp + test requirements - no
# selenium/geopandas. conftest.py reads TEST_DATABASE_URL and refuses any database
# whose name doesn't end in _test.
name: tests

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: canask_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-only-test-secret-key-not-real
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/canask_test
      RECAPTCHA_ENABLED: "false"
      RATELIMIT_ENABLED: "false"
      COOKIE_SECURE: "false"
      PUBLIC_BASE_URL: http://localhost
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app_requirements/requirements.*.txt

      - name: Install dependencies
        run: pip install -r app_requirements/requirements.test.txt

      - name: Run test suite
        run: |
          set -o pipefail
          pytest -v \
            --junitxml=pytest-results.xml \
            --cov=data_viz --cov-report=term \
            2>&1 | tee pytest-output.txt

      - name: Publish summary
        if: always()
        run: |
          echo '## Test results' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 40 pytest-output.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload junit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-results.xml
