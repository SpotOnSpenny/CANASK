# Base compose: environment-neutral, secure-by-default.
#   - The per-service env file is APP_ENV_FILE (defaults to the dev file). `make dev-up` leaves it unset
#     (-> .env.dev); `make prod-up` exports APP_ENV_FILE=app_config/.env.prod so no dev secrets load in prod.
#   - No source bind-mount here (that's a dev convenience, added in docker-compose.dev.yml). Prod runs the
#     code baked into the image (Dockerfile `COPY . .`).
#   - `web` defaults to gunicorn so forgetting the dev/prod override fails safe (never the Werkzeug dev
#     server). docker-compose.dev.yml overrides it back to `flask run --debug`.

# Cap container log files so they can't fill the disk (applied to every service via the anchor below).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16
    logging: *default-logging
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      args:
        REQUIREMENTS_FILE: app_requirements/requirements.webapp.txt
    command: gunicorn --workers ${GUNICORN_WORKERS:-3} --bind 0.0.0.0:5000 --timeout 60 --access-logfile - --error-logfile - data_viz:app
    logging: *default-logging
    env_file:
      - ${APP_ENV_FILE:-app_config/.env.dev}
    healthcheck:
      # python (no curl/wget in the slim image) hits the DB-free liveness route.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/healthz').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      args:
        REQUIREMENTS_FILE: app_requirements/requirements.scraper.txt
    command: celery -A data_viz:celery worker --loglevel=info
    logging: *default-logging
    env_file:
      - ${APP_ENV_FILE:-app_config/.env.dev}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: .
      args:
        REQUIREMENTS_FILE: app_requirements/requirements.scraper.txt
    command: celery -A data_viz:celery beat --loglevel=info
    logging: *default-logging
    env_file:
      - ${APP_ENV_FILE:-app_config/.env.dev}
    depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_healthy
volumes:
  postgres_data:
